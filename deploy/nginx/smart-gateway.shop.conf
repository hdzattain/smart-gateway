server_tokens off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream smart_gateway_new_api {
    server 127.0.0.1:3000 max_fails=3 fail_timeout=30s;
    keepalive 512;
}

server {
    listen 80;
    listen [::]:80;
    server_name smart-gateway.shop;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name smart-gateway.shop;

    ssl_certificate /etc/letsencrypt/live/smart-gateway.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smart-gateway.shop/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 100m;
    client_body_timeout 120s;
    keepalive_timeout 75s;
    keepalive_requests 10000;

    proxy_connect_timeout 60s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 2;

    gzip off;

    location = /healthz {
        proxy_pass http://smart_gateway_new_api/api/status;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no always;
    }

    location / {
        proxy_pass http://smart_gateway_new_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no always;
    }
}
