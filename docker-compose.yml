services:
  mysql:
    image: mysql:8.4
    container_name: smart-gateway-mysql
    restart: always
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=128M
      - --innodb-log-buffer-size=16M
      - --max-connections=300
      - --table-open-cache=256
      - --performance-schema=OFF
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: smart-gateway
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - smart-gateway-net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: 768m

  redis:
    image: redis:7-alpine
    container_name: smart-gateway-redis
    restart: always
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
      - --tcp-backlog
      - "2048"
      - --timeout
      - "0"
      - --tcp-keepalive
      - "60"
    volumes:
      - redis_data:/data
    networks:
      - smart-gateway-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 320m

  smart-gateway:
    image: hdzattain/smart-gateway:latest
    container_name: smart-gateway-smart-gateway
    restart: always
    command: --log-dir /app/logs
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    environment:
      TZ: Asia/Shanghai
      SQL_DSN: root:${MYSQL_ROOT_PASSWORD}@tcp(mysql:3306)/smart-gateway?charset=utf8mb4&parseTime=true&loc=Asia%2FShanghai
      REDIS_CONN_STRING: redis://redis:6379/0
      SESSION_SECRET: ${SESSION_SECRET}
      ERROR_LOG_ENABLED: "true"
      BATCH_UPDATE_ENABLED: "true"
      MEMORY_CACHE_ENABLED: "true"
      SQL_MAX_IDLE_CONNS: "20"
      SQL_MAX_OPEN_CONNS: "100"
      SQL_MAX_LIFETIME: "60"
      STREAMING_TIMEOUT: "300"
      RELAY_TIMEOUT: "0"
      RELAY_IDLE_CONN_TIMEOUT: "90"
      NODE_NAME: smart-gateway-node-1
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - smart-gateway-net
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O - http://127.0.0.1:3000/api/status | grep -q 'success' || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    mem_limit: 768m

volumes:
  mysql_data:
  redis_data:

networks:
  smart-gateway-net:
    driver: bridge
